<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>D3 Family Tree Example</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
  </head>
  <body>
    <svg width="960" height="600"></svg>

    <script>
      const data = {
        id: 1,
        name: "Abdur Rahman",
        gender: "M",
        mo: "Abdur Rahman",
        fa: "Abdur Rahman",
        children: [
          {
            id: 2,
            name: "Fatima Rahman",
            gender: "F",
            mo: "Fatima Rahman",
            fa: "Fatima Rahman",
            children: [
              {
                id: 3,
                name: "Karim Rahman",
                gender: "M",
                mo: "Fatima Rahman",
                fa: "Fatima Rahman",
              },
              {
                id: 4,
                name: "Layla Rahman",
                gender: "F",
                mo: "Fatima Rahman",
                fa: "Fatima Rahman",
                children: [
                  {
                    id: 5,
                    name: "Ayan Rahman",
                    gender: "M",
                    mo: "Ayan Rahman",
                    fa: "Fatima Rahman",
                  },
                ],
              },
            ],
          },
        ],
      };
      const width = 960;
      const height = 600;

      const svg = d3.select("svg").attr("width", width).attr("height", height);

      const root = d3.hierarchy(data);

      const treeLayout = d3.tree().size([width - 100, height - 100]);
      treeLayout(root);

      // Draw links
      svg
        .selectAll("line.link")
        .data(root.links())
        .enter()
        .append("line")
        .attr("class", "link")
        .attr("x1", (d) => d.source.x + 50)
        .attr("y1", (d) => d.source.y + 50)
        .attr("x2", (d) => d.target.x + 50)
        .attr("y2", (d) => d.target.y + 50)
        .attr("stroke", "#555");

      // Draw nodes
      const node = svg
        .selectAll("g.node")
        .data(root.descendants())
        .enter()
        .append("g")
        .attr("class", "node")
        .attr("transform", (d) => `translate(${d.x + 50}, ${d.y + 50})`);

      // node
      //   .append("circle")
      //   .attr("r", 30)
      //   .attr("fill", (d) => (d.data.gender === "M" ? "#88c" : "#c88"));

      node
        .append("rect")
        .attr("width", 120)
        .attr("height", 60)
        .attr("x", -60)
        .attr("y", -20)
        .style("fill", (d) => (d.data.gender === "M" ? "#88c" : "#c88"))
        .style("stroke", "#000");

      node
        .append("text")
        .attr("dy", 6) // move the name slightly lower
        .attr("text-anchor", "middle")
        .attr("dominant-baseline", "middle")
        .text((d) => `${d.data.name}`);

      node
        .append("text")
        .attr("dy", 24) // move the second line lower (since circle is bigger)
        .attr("text-anchor", "middle")
        .attr("dominant-baseline", "middle")
        .style("font-size", "10px")
        .style("fill", "#666")
        .text((d) => `Mother: ${d.data.mo}`);
    </script>
  </body>
</html>
