<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>D3 Family Tree Example</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <style>
      .tooltip {
        position: absolute;
        background: rgba(0, 0, 0, 0.8);
        color: white;
        padding: 5px 10px;
        border-radius: 5px;
        font-size: 12px;
        pointer-events: none;
        display: none;
      }
    </style>
  </head>
  <body>
    <svg width="960" height="600"></svg>
    <div id="tooltip" class="tooltip"></div>

    <script>
      const data = {
        id: 1,
        name: "Abdur Rahman",
        gender: "M",
        mo: "Abdur Rahman",
        fa: "Abdur Rahman",
        children: [
          {
            id: 2,
            name: "Fatima Rahman",
            gender: "F",
            mo: "Fatima Rahman",
            fa: "Fatima Rahman",
            children: [
              {
                id: 3,
                name: "Karim Rahman",
                gender: "M",
                mo: "Fatima Rahman",
                fa: "Fatima Rahman",
              },
              {
                id: 4,
                name: "Layla Rahman",
                gender: "F",
                mo: "Fatima Rahman",
                fa: "Fatima Rahman",
                children: [
                  {
                    id: 5,
                    name: "Ayan Rahman",
                    gender: "M",
                    mo: "Ayan Rahman",
                    fa: "Fatima Rahman",
                  },
                ],
              },
            ],
          },
        ],
      };

      const width = window.innerWidth;
      const height = window.innerHeight;

      const svg = d3.select("svg").attr("width", width).attr("height", height);

      // Add zoom behavior
      const g = svg.append("g");

      const zoom = d3
        .zoom()
        .scaleExtent([0.5, 3])
        .on("zoom", (event) => {
          g.attr("transform", event.transform);
        });
      svg.call(zoom);

      const root = d3.hierarchy(data);
      const treeLayout = d3.tree().size([width - 100, height - 100]);
      treeLayout(root);

      // Draw links
      g.selectAll("line.link")
        .data(root.links())
        .enter()
        .append("line")
        .attr("class", "link")
        .attr("x1", (d) => d.source.x + 50)
        .attr("y1", (d) => d.source.y + 50)
        .attr("x2", (d) => d.target.x + 50)
        .attr("y2", (d) => d.target.y + 50)
        .attr("stroke", "#555");

      // Tooltip div
      const tooltip = d3.select("#tooltip");

      // Draw nodes
      const node = g
        .selectAll("g.node")
        .data(root.descendants())
        .enter()
        .append("g")
        .attr("class", "node")
        .attr("transform", (d) => `translate(${d.x + 50}, ${d.y + 50})`)
        .on("mouseover", function (event, d) {
          tooltip
            .style("left", event.pageX + 10 + "px")
            .style("top", event.pageY - 20 + "px")
            .style("display", "inline-block")
            .html(
              `<strong>${d.data.name}</strong><br>Gender: ${d.data.gender}<br>Mother: ${d.data.mo}<br>Father: ${d.data.fa}`
            );
          d3.select(this)
            .select("rect")
            .style("stroke", "orange")
            .style("stroke-width", 3);
        })
        .on("mouseout", function (event, d) {
          tooltip.style("display", "none");
          d3.select(this)
            .select("rect")
            .style("stroke", "#000")
            .style("stroke-width", 1);
        })
        .on("click", function (event, d) {
          alert(`Clicked on ${d.data.name}`);
        });

      node
        .append("rect")
        .attr("width", 120)
        .attr("height", 60)
        .attr("x", -60)
        .attr("y", -20)
        .style("fill", (d) => (d.data.gender === "M" ? "#88c" : "#c88"))
        .style("stroke", "#000");

      node
        .append("text")
        .attr("dy", 6)
        .attr("text-anchor", "middle")
        .attr("dominant-baseline", "middle")
        .text((d) => `${d.data.name}`);

      node
        .append("text")
        .attr("dy", 24)
        .attr("text-anchor", "middle")
        .attr("dominant-baseline", "middle")
        .style("font-size", "10px")
        .style("fill", "#666")
        .text((d) => `Mother: ${d.data.mo}`);
    </script>
  </body>
</html>
